<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Repo Agent</title>
    <link rel="stylesheet" href="/vendor/xterm.css">
    <style>
      :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
      body { max-width: 1100px; margin: 36px auto; padding: 0 18px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      h1 { font-size: 1.5rem; }
      section { margin: 20px 0; padding: 20px; border: 1px solid #30363d; border-radius: 10px; background: #161b22; }
      button { padding: 10px 12px; border: 1px solid #30363d; border-radius: 7px; font: inherit; background: #238636; color: white; cursor: pointer; font-weight: 600; }
      button.secondary { background: #21262d; border-color: #484f58; }
      button:disabled { opacity: .55; cursor: wait; }
      .muted { color: #8b949e; font-size: .9rem; }
      .terminal-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .terminal-actions { display: flex; gap: 8px; }
      .terminal-tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid #30363d; }
      .terminal-tab { display: flex; flex: 0 0 auto; align-items: center; }
      .terminal-tab button { border-radius: 7px 7px 0 0; background: #21262d; }
      .terminal-tab button[aria-selected="true"] { background: #0d1117; border-bottom-color: #0d1117; }
      .terminal-tab .close-tab { border-radius: 0 7px 0 0; padding-left: 9px; padding-right: 9px; color: #8b949e; }
      .terminal-panel { height: 58vh; min-height: 280px; padding: 12px; background: #010409; border: 1px solid #30363d; border-top: 0; }
      .terminal-panel[hidden] { display: none; }
      .terminal-host { width: 100%; height: 100%; }
      .empty { padding: 28px 8px; text-align: center; }
      @media (max-width: 600px) {
        body { margin-top: 20px; }
        .terminal-toolbar { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Repo Agent</h1>
      <button id="logout" class="secondary" type="button">Wyloguj</button>
    </header>
    <p class="muted">Każdy terminal otwiera PowerShell w repozytorium gup z załadowanym skryptem <code>gup.ps1</code>.</p>
    <section>
      <button id="terminal-create" type="button">Utwórz terminal gup</button>
      <p id="terminal-status" class="muted" role="status" aria-live="polite">Łączenie z serwerem…</p>
    </section>
    <section>
      <div class="terminal-toolbar">
        <div>
          <h2>Terminale</h2>
          <span id="active-terminal-status" class="muted">Brak otwartych terminali.</span>
        </div>
        <div class="terminal-actions">
          <button id="terminal-clear" class="secondary" type="button" disabled>Wyczyść ekran</button>
          <button id="terminal-interrupt" class="secondary" type="button" disabled>Przerwij (Ctrl+C)</button>
        </div>
      </div>
      <div id="terminal-tabs" class="terminal-tabs" role="tablist" aria-label="Zakładki terminali"></div>
      <div id="terminal-panels"></div>
      <p id="terminal-empty" class="muted empty">Utwórz terminal, aby rozpocząć pracę z gup.</p>
    </section>
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script>
      const createTerminalButton = document.querySelector("#terminal-create");
      const terminalTabs = document.querySelector("#terminal-tabs");
      const terminalPanels = document.querySelector("#terminal-panels");
      const terminalEmpty = document.querySelector("#terminal-empty");
      const terminalStatus = document.querySelector("#terminal-status");
      const activeTerminalStatus = document.querySelector("#active-terminal-status");
      const clearTerminalButton = document.querySelector("#terminal-clear");
      const interruptTerminalButton = document.querySelector("#terminal-interrupt");
      let socket;
      let activeTerminalId = null;
      const terminalViews = new Map();

      function send(message) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(message));
          return true;
        }
        return false;
      }

      function fitTerminal(view) {
        if (!view || view.id !== activeTerminalId || view.exited) return;
        view.fit.fit();
        send({
          type: "terminal-resize",
          terminalId: view.id,
          cols: view.terminal.cols,
          rows: view.terminal.rows
        });
      }

      function renderTerminalTabs() {
        terminalTabs.replaceChildren();
        for (const view of terminalViews.values()) {
          const tab = document.createElement("div");
          tab.className = "terminal-tab";
          const select = document.createElement("button");
          select.type = "button";
          select.id = `terminal-tab-${view.id}`;
          select.setAttribute("role", "tab");
          select.setAttribute("aria-controls", `terminal-panel-${view.id}`);
          select.setAttribute("aria-selected", String(view.id === activeTerminalId));
          select.textContent = view.name;
          select.addEventListener("click", () => activateTerminal(view.id));
          const close = document.createElement("button");
          close.type = "button";
          close.className = "close-tab";
          close.textContent = "×";
          close.setAttribute("aria-label", `Zamknij ${view.name}`);
          close.addEventListener("click", () => send({ type: "terminal-close", terminalId: view.id }));
          tab.append(select, close);
          terminalTabs.append(tab);
          view.panel.hidden = view.id !== activeTerminalId;
        }
        const activeView = terminalViews.get(activeTerminalId);
        terminalEmpty.hidden = terminalViews.size > 0;
        clearTerminalButton.disabled = !activeView || activeView.exited;
        interruptTerminalButton.disabled = !activeView || activeView.exited;
        activeTerminalStatus.textContent = activeView
          ? (activeView.exited ? "Proces terminala zakończony." : `Połączono · ${activeView.name}`)
          : "Brak otwartych terminali.";
      }

      function activateTerminal(terminalId) {
        if (!terminalViews.has(terminalId)) return;
        activeTerminalId = terminalId;
        renderTerminalTabs();
        const view = terminalViews.get(terminalId);
        requestAnimationFrame(() => {
          fitTerminal(view);
          view.terminal.focus();
        });
      }

      function createTerminalView(terminal) {
        const panel = document.createElement("div");
        panel.className = "terminal-panel";
        panel.id = `terminal-panel-${terminal.id}`;
        panel.setAttribute("role", "tabpanel");
        panel.setAttribute("aria-labelledby", `terminal-tab-${terminal.id}`);
        const host = document.createElement("div");
        host.className = "terminal-host";
        panel.append(host);
        terminalPanels.append(panel);

        const instance = new Terminal({
          cursorBlink: true,
          scrollback: 5000,
          fontFamily: "ui-monospace, SFMono-Regular, Consolas, monospace",
          fontSize: 13,
          theme: { background: "#010409", foreground: "#c9d1d9" }
        });
        const fit = new FitAddon.FitAddon();
        instance.loadAddon(fit);
        instance.open(host);
        const view = {
          id: terminal.id,
          name: terminal.name,
          exited: terminal.exited,
          panel,
          terminal: instance,
          fit
        };
        instance.onData((data) => {
          if (!view.exited) send({ type: "terminal-input", terminalId: view.id, data });
        });
        new ResizeObserver(() => fitTerminal(view)).observe(host);
        if (terminal.output) instance.write(terminal.output);
        if (terminal.exited) instance.write("\r\n[Proces terminala zakończony]\r\n");
        terminalViews.set(view.id, view);
        if (!activeTerminalId) activeTerminalId = view.id;
        renderTerminalTabs();
        return view;
      }

      function updateTerminal(terminal) {
        const view = terminalViews.get(terminal.id) || createTerminalView(terminal);
        view.name = terminal.name;
        view.exited = terminal.exited;
        renderTerminalTabs();
      }

      function removeTerminal(terminalId) {
        const view = terminalViews.get(terminalId);
        if (!view) return;
        view.terminal.dispose();
        view.panel.remove();
        terminalViews.delete(terminalId);
        if (activeTerminalId === terminalId) {
          activeTerminalId = terminalViews.keys().next().value || null;
        }
        renderTerminalTabs();
        const activeView = terminalViews.get(activeTerminalId);
        if (activeView) requestAnimationFrame(() => fitTerminal(activeView));
      }

      async function connect() {
        const session = await fetch("/api/session");
        if (!session.ok) return location.assign("/login");
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${location.host}/ws`);
        socket.addEventListener("open", () => {
          terminalStatus.textContent = "Połączono z serwerem.";
          createTerminalButton.disabled = false;
        });
        socket.addEventListener("message", (event) => {
          const message = JSON.parse(event.data);
          if (message.type === "error") {
            terminalStatus.textContent = message.text;
            createTerminalButton.disabled = false;
          }
          if (message.type === "ready") {
            for (const terminal of message.terminals) updateTerminal(terminal);
          }
          if (message.type === "terminal-created") {
            createTerminalButton.disabled = false;
            updateTerminal(message.terminal);
            activateTerminal(message.terminal.id);
          }
          if (message.type === "terminal-output") {
            const view = terminalViews.get(message.terminalId);
            if (view) view.terminal.write(message.text);
          }
          if (message.type === "terminal-exit") {
            const view = terminalViews.get(message.terminalId);
            if (view) {
              view.exited = true;
              view.terminal.write("\r\n[Proces terminala zakończony]\r\n");
              renderTerminalTabs();
            }
          }
          if (message.type === "terminal-closed") removeTerminal(message.terminalId);
          if (message.type === "terminal-cleared") {
            const view = terminalViews.get(message.terminalId);
            if (view) view.terminal.clear();
          }
        });
        socket.addEventListener("close", () => {
          terminalStatus.textContent = "Połączenie z serwerem zostało zamknięte.";
          createTerminalButton.disabled = true;
        });
        socket.addEventListener("error", () => {
          terminalStatus.textContent = "Błąd połączenia WebSocket.";
        });
      }

      createTerminalButton.addEventListener("click", () => {
        if (send({ type: "terminal-create" })) {
          createTerminalButton.disabled = true;
          terminalStatus.textContent = "Uruchamianie terminala gup…";
        }
      });
      clearTerminalButton.addEventListener("click", () => {
        if (activeTerminalId) send({ type: "terminal-clear", terminalId: activeTerminalId });
      });
      interruptTerminalButton.addEventListener("click", () => {
        if (activeTerminalId) send({ type: "terminal-signal", terminalId: activeTerminalId });
      });
      document.querySelector("#logout").addEventListener("click", async () => {
        await fetch("/api/logout", { method: "POST" });
        location.assign("/login");
      });
      window.addEventListener("resize", () => fitTerminal(terminalViews.get(activeTerminalId)));
      createTerminalButton.disabled = true;
      connect().catch((error) => {
        terminalStatus.textContent = `Nie udało się połączyć z serwerem: ${error.message}`;
      });
    </script>
  </body>
</html>
