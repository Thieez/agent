<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie — Repo Agent</title>
    <style>
      :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; }
      main { width: min(360px, calc(100% - 40px)); padding: 28px; border: 1px solid #30363d; border-radius: 12px; background: #161b22; }
      h1 { margin-top: 0; font-size: 1.35rem; }
      label { display: block; margin-bottom: 8px; }
      input, button { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #30363d; border-radius: 7px; font: inherit; }
      input { margin-bottom: 12px; background: #0d1117; color: inherit; }
      button { border: 0; background: #238636; color: white; cursor: pointer; font-weight: 600; }
      #error { min-height: 1.4em; color: #ff7b72; }
    </style>
  </head>
  <body>
    <main>
      <h1>Repo Agent</h1>
      <form id="login-form">
        <label for="password">Hasło aplikacji</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Zaloguj</button>
      </form>
      <p id="error" role="alert"></p>
    </main>
    <script>
      const form = document.querySelector("#login-form");
      const error = document.querySelector("#error");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: form.password.value })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Logowanie nie powiodło się.");
          location.assign("/");
        } catch (failure) {
          error.textContent = failure.message;
        }
      });
    </script>
  </body>
</html>
